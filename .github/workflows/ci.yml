name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: habitquest
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: habitquest_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habitquest -d habitquest_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://habitquest:ci_only@localhost:5432/habitquest_ci_test?schema=public
      TEST_DATABASE_URL: postgresql://habitquest:ci_only@localhost:5432/habitquest_ci_test?schema=public
      ALLOW_TEST_FIXTURES: "yes"
      VITE_API_URL: http://127.0.0.1:3003
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Gitleaks
        run: bash scripts/install-gitleaks-ci.sh
      - run: npm run check:secrets
      - run: npm run security:audit
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:production-smoke
      - run: npx playwright install --with-deps chromium
      - name: Accessibility regression with isolated demo data
        run: |
          mkdir -p work
          npm run demo:seed
          WEB_ORIGIN=http://127.0.0.1:5175 PORT=3003 HOST=127.0.0.1 node apps/api/dist/server.js > work/a11y-api.log 2>&1 &
          api_pid=$!
          npm run dev -w @habitquest/web -- --host 127.0.0.1 --port 5175 --strictPort > work/a11y-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3003/api/ready >/dev/null && curl --fail --silent http://127.0.0.1:5175 >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3003/api/ready >/dev/null
          npm run test:a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: accessibility-report
          path: docs/verification/accessibility.json
          retention-days: 7
          if-no-files-found: ignore
